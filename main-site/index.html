<!doctype html>
<html lang="en">

<head>
    <script>
        // Runs before first paint, so the saved theme lands before the page
        // draws. Keep the key in sync with APP_KEY in js/theme.js.
        (function () {
            var k = "uwuflash";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode. Resolved here rather than in theme.js because
            // theme.js runs after first paint, and an evening reader would
            // otherwise watch a white page turn dark. Keep the two hours in
            // step with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in theme.js.
            document.documentElement.setAttribute("data-mode-preference", m);
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
            }

            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCYFTFPEL"></script>
    <script>

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'G-FMCYFTFPEL');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9715826188316382"
        crossorigin="anonymous"></script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>uwuFlash | UwU Apps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Write text on screen, add a picture, and hold it up. Flashcards for high visibility signboards.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="uwuFlash | UwU Apps" />
    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="Write text on screen, add a picture, and hold it up. Flashcards for high visibility signboards." />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    <link rel="stylesheet" href="/style.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/UFCS-192.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/UFCS-main.png">
    <meta property="og:image" content="/UFCS-main.png" />
</head>

<body>
    <main class="app">
        <header class="topbar">
            <h1>uwuFlash</h1>
            <button class="icon-btn" id="presentBtn" type="button" aria-label="Present fullscreen">
                <span data-icon="play"></span>
            </button>
            <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
                <span data-icon="sun"></span>
            </button>
        </header>

        <section class="card-frame glass" aria-label="Card preview">
            <div class="card-canvas" id="preview"></div>
        </section>

        <section class="panel glass">
            <div class="panel-head">
                <h2>Where the image sits</h2>
            </div>
            <div class="layout-picker" id="layoutPicker"></div>
        </section>

        <section class="panel glass">
            <div class="panel-head">
                <h2>Layers</h2>
            </div>
            <ul class="layer-list" id="layerList"></ul>
            <div class="button-row">
                <button class="btn" id="addTextBtn" type="button">
                    <span data-icon="text"></span>Add text
                </button>
                <button class="btn" id="addImageBtn" type="button">
                    <span data-icon="image"></span>Add image
                </button>
            </div>
            <input class="visually-hidden" id="imageInput" type="file" accept="image/*" tabindex="-1">
            <div class="inspector" id="inspector"></div>
        </section>

        <section class="panel glass">
            <div class="panel-head">
                <h2>Cards</h2>
                <span class="count" id="cardCount"></span>
            </div>
            <ul class="card-strip" id="cardStrip"></ul>
            <div class="button-row">
                <button class="btn" id="addCardBtn" type="button">
                    <span data-icon="plus"></span>New card
                </button>
                <button class="btn" id="duplicateCardBtn" type="button">
                    <span data-icon="copy"></span>Duplicate
                </button>
                <button class="btn" id="cardBackBtn" type="button" aria-label="Move card earlier">
                    <span data-icon="left"></span>
                </button>
                <button class="btn" id="cardForwardBtn" type="button" aria-label="Move card later">
                    <span data-icon="right"></span>
                </button>
                <button class="btn btn-quiet" id="deleteCardBtn" type="button">
                    <span data-icon="trash"></span>Delete
                </button>
            </div>
        </section>
    </main>

    <div class="present hidden" id="present" role="dialog" aria-modal="true" aria-label="Presenting">
        <div class="card-canvas presenting" id="presentCanvas"></div>
        <button class="present-tap prev" id="presentPrev" type="button" aria-label="Previous card"></button>
        <button class="present-tap next" id="presentNext" type="button" aria-label="Next card"></button>
        <button class="present-exit" id="presentExit" type="button" aria-label="Stop presenting">
            <span data-icon="exit"></span>
        </button>
        <p class="present-count" id="presentCount"></p>
    </div>

    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span>Light</button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span>Dark</button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span>Time-based</button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>

</html>
